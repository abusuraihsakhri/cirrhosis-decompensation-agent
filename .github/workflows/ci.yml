name: CI

on:
  push:
    branches: [ master, main, "audit/**" ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check package build
        run: python -m build

      - name: Lint
        run: ruff check .

      - name: Check browser assets
        run: |
          node --check docs/app.js
          node --check docs/worker.js
          test -f docs/index.html
          grep -q 'id="analyzeBtn"' docs/index.html

      - name: Run tests
        run: pytest -q

      - name: Run CLI smoke tests
        run: |
          cirrhosis-decompensation meld --cr 1.5 --bili 2.5 --inr 1.3 --na 133 --alb 2.8
          cirrhosis-decompensation batch -i sample.csv -o out_smoke.csv

      - name: Compile Python sources
        run: python -m compileall -q cirrhosis_decompensation.py cli.py

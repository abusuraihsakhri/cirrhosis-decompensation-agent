name: CI

on:
  push:
    branches: [ master, main, "audit/**", "fix/**" ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check package build
        run: python -m build

      - name: Lint
        run: ruff check .

      - name: Check browser assets
        run: |
          node --check docs/app.js
          node --check docs/worker.js
          test -f docs/index.html
          grep -q 'id="analyzeBtn"' docs/index.html

      - name: Run tests
        run: pytest -q

      - name: Run CLI smoke tests
        run: |
          cirrhosis-decompensation meld --cr 1.5 --bili 2.5 --inr 1.3 --na 133 --alb 2.8
          cirrhosis-decompensation batch -i sample.csv -o out_smoke.csv

      - name: Compile Python sources
        run: python -m compileall -q cirrhosis_decompensation.py cli.py

  browser-runtime:
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "314.0.7"
      PYODIDE_CORE_SHA256: "2abdcc2e35208af406e07724cffa85bc582ced97e9028383ecf5462541393f95"

    steps:
      - uses: actions/checkout@v4

      - name: Validate self-hosted Pyodide bundle
        run: |
          set -euo pipefail

          if grep -q "cdn.jsdelivr.net" docs/worker.js; then
            echo "worker.js must not depend on jsDelivr at runtime"
            exit 1
          fi

          archive="/tmp/pyodide-core-${PYODIDE_VERSION}.tar.bz2"
          url="https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-core-${PYODIDE_VERSION}.tar.bz2"

          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            "${url}" -o "${archive}"
          echo "${PYODIDE_CORE_SHA256}  ${archive}" | sha256sum --check -

          rm -rf /tmp/pyodide-core
          mkdir -p /tmp/pyodide-core
          tar -xjf "${archive}" -C /tmp/pyodide-core

          runtime_dir="$(dirname "$(find /tmp/pyodide-core -type f -name pyodide.js -print -quit)")"
          test -s "${runtime_dir}/pyodide.js"
          test -s "${runtime_dir}/pyodide.asm.mjs"
          test -s "${runtime_dir}/pyodide.asm.wasm"
          test -s "${runtime_dir}/pyodide-lock.json"
          test -s "${runtime_dir}/python_stdlib.zip"

name: Deploy Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  PYODIDE_VERSION: "314.0.7"
  PYODIDE_CORE_SHA256: "2abdcc2e35208af406e07724cffa85bc582ced97e9028383ecf5462541393f95"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/index.html docs/styles.css docs/app.js docs/worker.js _site/
          cp cirrhosis_decompensation.py _site/
          touch _site/.nojekyll

      - name: Bundle Pyodide runtime
        run: |
          set -euo pipefail
          archive="/tmp/pyodide-core-${PYODIDE_VERSION}.tar.bz2"
          url="https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-core-${PYODIDE_VERSION}.tar.bz2"

          curl --fail --location --retry 4 --retry-all-errors --silent --show-error             "${url}" -o "${archive}"
          echo "${PYODIDE_CORE_SHA256}  ${archive}" | sha256sum --check -

          rm -rf /tmp/pyodide-core
          mkdir -p /tmp/pyodide-core _site/pyodide
          tar -xjf "${archive}" -C /tmp/pyodide-core

          pyodide_js="$(find /tmp/pyodide-core -type f -name pyodide.js -print -quit)"
          test -n "${pyodide_js}"
          runtime_dir="$(dirname "${pyodide_js}")"

          for required in pyodide.js pyodide.asm.mjs pyodide.asm.wasm pyodide-lock.json python_stdlib.zip; do
            test -s "${runtime_dir}/${required}"
          done

          find "${runtime_dir}" -maxdepth 1 -type f -exec cp {} _site/pyodide/ \;

          test -s _site/pyodide/pyodide.js
          test -s _site/pyodide/pyodide.asm.wasm
          test -s _site/pyodide/python_stdlib.zip
          du -sh _site/pyodide

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

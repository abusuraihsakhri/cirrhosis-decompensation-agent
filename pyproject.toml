[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cirrhosis-decompensation-agent"
version = "2.1.0"
description = "Cirrhosis scoring and decompensation assessment utilities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
cirrhosis-decompensation = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cirrhosis-decompensation-agent"
Repository = "https://github.com/abusuraihsakhri/cirrhosis-decompensation-agent.git"

[tool.setuptools]
py-modules = ["cirrhosis_decompensation", "cli"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

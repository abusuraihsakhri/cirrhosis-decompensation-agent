[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirrhosis-decompensation-engine"
version = "2.0.0"
description = "CirrhoMind: MELD 3.0, Variceal Bleed & Hepatorenal Syndrome (HRS-AKI) Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cirrhosis-decompensation-engine = "cirrhosis_decompensation_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cirrhosis-decompensation-engine"
Repository = "https://github.com/abusuraihsakhri/cirrhosis-decompensation-engine.git"
